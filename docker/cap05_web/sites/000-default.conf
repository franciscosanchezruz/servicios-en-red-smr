<VirtualHost *:80>
    ServerName www.smr.lan
    ServerAlias smr.lan
    DocumentRoot /var/www/html/www
    ErrorLog ${APACHE_LOG_DIR}/www_error.log
    CustomLog ${APACHE_LOG_DIR}/www_access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName intranet.smr.lan
    DocumentRoot /var/www/html/intranet
    ErrorLog ${APACHE_LOG_DIR}/intranet_error.log
    CustomLog ${APACHE_LOG_DIR}/intranet_access.log combined

    # Directorio privado con autenticación de usuarios en contenedor
    <Directory /var/www/html/intranet/privado>
        AuthType Basic
        AuthName "Zona Privada Docker"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>
</VirtualHost>

# Host virtual seguro HTTPS en el puerto 443
<VirtualHost *:443>
    ServerName www.smr.lan
    DocumentRoot /var/www/html/www
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/smr_web.crt
    SSLCertificateKeyFile /etc/ssl/private/smr_web.key
    ErrorLog ${APACHE_LOG_DIR}/www_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/www_ssl_access.log combined
</VirtualHost>
