# ==============================================================================
# /etc/dhcp/dhcpd.conf - Configuración Oficial DHCP (smr.lan)
# Libro: 'Servicios en Red' - Francisco Sánchez Ruz (Editorial Monsálvez)
# ==============================================================================

default-lease-time 28800;
max-lease-time 86400;
authoritative;

subnet 10.0.0.0 netmask 255.255.255.0 {
    range 10.0.0.50 10.0.0.150;
    option routers 10.0.0.1;
    option domain-name-servers 10.0.0.10, 8.8.8.8;
    option domain-name "smr.lan";
    option broadcast-address 10.0.0.255;
    option ntp-servers 10.0.0.10;
}

# Reserva estática para la impresora de departamento
host impresora-laser {
    hardware ethernet 00:11:22:33:44:55;
    fixed-address 10.0.0.20;
}

# Reserva estática para el puesto del profesor
host puesto-docente {
    hardware ethernet AA:BB:CC:DD:EE:FF;
    fixed-address 10.0.0.25;
}
