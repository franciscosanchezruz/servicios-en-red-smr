# ==============================================================================
# /etc/apache2/sites-available/000-default.conf - VirtualHost Principal
# Libro: 'Servicios en Red' - Francisco Sánchez Ruz (Editorial Monsálvez)
# ==============================================================================
<VirtualHost *:80>
    ServerName www.smr.lan
    ServerAlias server.smr.lan smr.lan
    ServerAdmin webmaster@smr.lan
    DocumentRoot /var/www/html

    ErrorLog /error.log
    CustomLog /access.log combined

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
