# ==============================================================================
# /etc/vsftpd.conf - Servidor FTP vsftpd Seguro
# Libro: 'Servicios en Red' - Francisco Sánchez Ruz (Editorial Monsálvez)
# ==============================================================================
listen=YES
listen_ipv6=NO
anonymous_enable=YES
anon_root=/srv/ftp
anon_upload_enable=NO
anon_mkdir_write_enable=NO

local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

chroot_local_user=YES
allow_writeable_chroot=YES

# Rango de puertos pasivos para cortafuegos
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40050
pasv_address=10.0.0.10
