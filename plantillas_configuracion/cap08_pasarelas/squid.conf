# ==============================================================================
# /etc/squid/squid.conf - Servidor Proxy Caché con Control de Acceso
# ==============================================================================
http_port 3128

acl red_taller src 10.0.0.0/24
acl dominios_prohibidos dstdomain "/etc/squid/sitios_bloqueados.txt"

http_access deny dominios_prohibidos
http_access allow red_taller
http_access deny all

cache_mem 256 MB
maximum_object_size 64 MB
cache_dir ufs /var/spool/squid 1000 16 256
